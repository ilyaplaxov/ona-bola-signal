# Local Postgres for development and the demo. Works offline once the image is pulled.
# Host port 5433 avoids clashing with a Postgres already installed on a teammate's laptop.
name: ona-bola-signal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ona
      POSTGRES_PASSWORD: ona_dev_only
      POSTGRES_DB: ona_bola
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ona_bola_pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ona -d ona_bola"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ona_bola_pg:
